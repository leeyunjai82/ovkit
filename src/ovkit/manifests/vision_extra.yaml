# Depth and background removal — mirrored from leeyunjai/edge-lab.
# ---------------------------------------------------------------------------
# Both are Apache-2.0 and live in leeyunjai/ovkit-models rather than being
# read from edge-lab directly: that repository is tagged agpl-3.0, and nothing
# copyleft ships with ovkit (the same rule that put RT-DETR here instead of
# YOLO). scripts/import_edge_lab.py does the copy.
#
# Depth Anything V2: the **Small** checkpoint only. Base, Large and Giant are
# CC-BY-NC-4.0 and must never be mirrored here.
# ---------------------------------------------------------------------------

depth_anything_v2_small:
  src: hf
  repo: leeyunjai/ovkit-models
  filename: depth/depth_anything_v2_small/model.xml
  task: depth
  description: Depth Anything V2 Small — how far away everything in the picture is.
  precision: fp16
  license: apache-2.0
  imgsz: 518
  preprocess:
    rgb: true
    scale: 255.0
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

u2net:
  src: url
  url: https://huggingface.co/leeyunjai/ovkit-models/resolve/main/background/u2net/u2net.onnx
  task: background
  description: U2-Net — separates the subject from the background (salient object).
  precision: fp16
  license: apache-2.0
  imgsz: 320
  preprocess:
    rgb: true
    scale: 255.0
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
