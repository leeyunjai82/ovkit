# ovkit model registry
# ---------------------------------------------------------------------------
# Adding a model = one entry here. No hardcoding model names in code.
#
# Required fields:
#   src       : hf | url | genai | anomalib
#   task      : detect | classify | segment | pose | face | ...
#   license   : SPDX id. MUST be permissive (Apache-2.0, MIT, BSD, ...).
#               Non-permissive (AGPL, non-commercial) models MUST NOT be added.
#
# Source-specific fields:
#   hf  : repo (required), filename (optional, single file) or subfolder
#   url : url (required, points at .onnx or .xml)
#
# Optional fields:
#   precision   : fp32 | fp16 | int8   (target IR precision after conversion)
#   sha256      : integrity check for the *downloaded* artifact (hex digest)
#   imgsz       : default inference square size
#   preprocess  : mean/std/scale/layout hints for PrePostProcessor
#   postprocess : output decoding format + class metadata
# ---------------------------------------------------------------------------

# --- detect ---------------------------------------------------------------
# RT-DETR now lives in rtdetr.yaml, served from the project that trains it
# (github.com/leeyunjai82/rtdetr). Nothing else is defined here yet: every
# other model comes from omz.yaml, which build_mirror.py generates, with its
# labels and decode format wired up in labels.yaml.
#
# To add one by hand, copy this shape:
#
#   my_model:
#     src: hf                      # hf | url | genai
#     repo: some-org/some-repo     # hf: where it lives
#     filename: path/model.xml     # hf: which file (the .bin rides along)
#     task: detect                 # detect | classify | segment | pose | face | ...
#     description: One line, shown by `ovkit list`.
#     license: apache-2.0          # MUST be permissive — see core/constants.py
#     imgsz: 640
#     preprocess: {scale: 255.0}   # what the model expects at its input
#     postprocess: {format: detr, classes: coco80}
