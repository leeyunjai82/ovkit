  task: generic
  license: openrail
  license_url: https://huggingface.co/Supertone/supertonic-3/blob/main/LICENSE
  tier: part
  description: Supertonic 3 — flow matching; run it several times. (~63 MB)

supertonic3_vocoder:
  src: hf
  repo: leeyunjai/ovkit-models
  filename: tts/supertonic3/vocoder/model.xml
  task: generic
  license: openrail
  license_url: https://huggingface.co/Supertone/supertonic-3/blob/main/LICENSE
  tier: part
  description: Supertonic 3 — latent to a 44.1 kHz waveform. (~48 MB)
