# RT-DETR detectors, served from the rtdetr project's own mirror.
# ---------------------------------------------------------------------------
# The weights originate with the project that trains them
# (github.com/leeyunjai82/rtdetr, Apache-2.0 code and weights) and are mirrored
# into leeyunjai/ovkit-models like everything else ovkit serves, so there is one
# place to point an offline site at and one repository to keep alive. The
# rtdetr mirror stays as the fallback. The package is not a dependency: these
# are plain IR downloads, and `labels.txt` rides along with each so boxes
# answer "kite 0.83", not "class_21".
#
# scripts/sync_mirror.py copies them in.
#
# Install `rtdetr[train]` (or `ovkit[train]`) only to fine-tune one on your own
# data; running them needs nothing but ovkit.
#
#   name          params   COCO AP   use
#   rtdetr_r18      20M      46.4    live video, laptops — the `detect` default
#   rtdetr_r34      31M      48.9    a step up when r18 misses small objects
#   rtdetr_r50      43M      53.1    stills and accuracy work

# ---------------------------------------------------------------------------

rtdetr_r18:
  src: hf
  repo: leeyunjai/ovkit-models
  filename: detect/rtdetr_r18/model.xml
  task: detect
  description: RT-DETR R18 — COCO-80, NMS-free. Fastest; the detect default.
  precision: fp16
  license: apache-2.0
  imgsz: 640
  preprocess:
    layout: NCHW
    scale: 255.0
    mean: [0.0, 0.0, 0.0]
    std: [1.0, 1.0, 1.0]
  postprocess:
    format: detr
    classes: coco80
  fallback:
    src: hf
    repo: leeyunjai/rtdetr

rtdetr_r34:
  src: hf
  repo: leeyunjai/ovkit-models
  filename: detect/rtdetr_r34/model.xml
  task: detect
  description: RT-DETR R34 — COCO-80, NMS-free. Between r18 and r50.
  precision: fp16
  license: apache-2.0
  imgsz: 640
  preprocess:
    layout: NCHW
    scale: 255.0
    mean: [0.0, 0.0, 0.0]
    std: [1.0, 1.0, 1.0]
  postprocess:
    format: detr
    classes: coco80
  fallback:
    src: hf
    repo: leeyunjai/rtdetr

rtdetr_r50:
  src: hf
  repo: leeyunjai/ovkit-models
  filename: detect/rtdetr_r50/model.xml
  task: detect
  description: RT-DETR R50 — COCO-80, NMS-free. Most accurate of the three.
  precision: fp16
  license: apache-2.0
  imgsz: 640
  preprocess:
    layout: NCHW
    scale: 255.0
    mean: [0.0, 0.0, 0.0]
    std: [1.0, 1.0, 1.0]
  postprocess:
    format: detr
    classes: coco80
  fallback:
    src: hf
    repo: leeyunjai/rtdetr
