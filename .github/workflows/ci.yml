name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: python -m pip install --upgrade pip ruff black
      - name: ruff
        run: ruff check src tests
      - name: black
        run: black --check src tests docs/conf.py

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        # ovkit's first users are on Korean Windows laptops, and this matrix was
        # Ubuntu-only. Two bugs shipped because of it: `Path.read_text()` picks
        # the locale encoding, so cp949 choked on the em dashes in our own
        # source, and `cv2.imread` hands the path to the C++ runtime, which
        # turned 철수.png into 泥좎닔.png. Neither can reproduce on Linux.
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest -q

  docs:
    name: Docs (sphinx-build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + docs deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r docs/requirements.txt
      - name: Build HTML docs (EN + KO)
        run: |
          sphinx-build -b html -W --keep-going docs docs/_build/html
          sphinx-build -b html -W --keep-going docs/ko docs/_build/html/ko
