name: Korean TTS (feasibility)

# Answers whether MeloTTS-Korean can become an OpenVINO model, with a log
# instead of an opinion. It ships nothing: no upload, no manifest entry.
#
# The questions, in order: does the package install, does the Korean
# checkpoint load, what does the phonemiser drag in, and can the synthesiser
# be traced to ONNX. The first failure is the answer.

on:
  workflow_dispatch:

jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenVINO (torch comes with melotts)
        run: python -m pip install --upgrade pip openvino

      - name: Try it
        # `unidic download` is what the checkpoint load asked for: MeloTTS
        # imports MeCab with a Japanese dictionary even for the Korean model.
        # It is ~250 MB and needs a C++ extension — part of the answer, not a
        # detail to hide, so the step is named for what it costs.
        run: |
          python scripts/try_korean_tts.py || true
          echo "::group::unidic 사전 내려받기 (약 250 MB)"
          python -m pip install --quiet unidic onnxscript || true
          python -m unidic download || true
          echo "::endgroup::"
          python scripts/try_korean_tts.py
