name: Korean TTS (feasibility)

# Answers whether MeloTTS-Korean can become an OpenVINO model, with a log
# instead of an opinion. It ships nothing: no upload, no manifest entry.
#
# The questions, in order: does the package install, does the Korean
# checkpoint load, what does the phonemiser drag in, and can the synthesiser
# be traced to ONNX. The first failure is the answer.

on:
  workflow_dispatch:

jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenVINO (torch comes with melotts)
        run: python -m pip install --upgrade pip openvino

      - name: Try it
        run: python scripts/try_korean_tts.py
