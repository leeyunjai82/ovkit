name: Supertonic

# Reads Supertonic's four ONNX graphs and its JSON tables, prints every
# interface, then actually runs the chain through OpenVINO and writes WAVs.
#
# A TTS pipeline chains four models. Guessing four interfaces would be four
# times the mistake that the OCR alphabet already cost, so they are read and
# printed here, the chain is run here, and the implementation copies from this
# log rather than from memory.
#
# Nothing is uploaded to the model mirror. The WAVs come back as artifacts so a
# person can listen and judge.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Hugging Face 저장소 (supertonic-3가 최신, supertonic은 opensource-en)"
        required: false
        default: "Supertone/supertonic-3"
      steps:
        description: "flow-matching 반복 횟수 (많을수록 느리고 깨끗함)"
        required: false
        default: "8"
      voice:
        description: "목소리 (F1..F5, M1..M5)"
        required: false
        default: "M1"
      mirror:
        description: "IR로 변환해 ovkit 미러에 올릴지 (끄면 변환만 하고 확인)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write        # to leave the report as a commit comment

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenVINO and the hub client
        run: python -m pip install --upgrade pip openvino huggingface_hub

      - name: Read the graphs
        run: |
          set -o pipefail
          python scripts/inspect_supertonic.py \
            --repo "${{ github.event.inputs.repo || 'Supertone/supertonic-3' }}" \
            2>&1 | tee report.txt

      - name: Say something
        run: |
          set -o pipefail
          python scripts/try_supertonic.py \
            --repo "${{ github.event.inputs.repo || 'Supertone/supertonic-3' }}" \
            --steps "${{ github.event.inputs.steps || 8 }}" \
            --voice "${{ github.event.inputs.voice || 'M1' }}" \
            --out tts_out 2>&1 | tee -a report.txt

      - name: Convert to IR and mirror it
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -o pipefail
          python scripts/mirror_supertonic.py \
            --source "${{ github.event.inputs.repo || 'Supertone/supertonic-3' }}" \
            ${{ inputs.mirror && '--upload' || '' }} \
            2>&1 | tee -a report.txt

      - name: Keep the audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supertonic-wav
          path: tts_out/
          if-no-files-found: warn

      - name: Leave the report on the commit
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/post_report.py report.txt "Supertonic 인터페이스와 시험 합성"
